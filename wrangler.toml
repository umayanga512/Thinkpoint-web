# Cloudflare Pages Configuration for ibr-web
name = "ibr-web"
pages_build_output_dir = "dist"
compatibility_date = "2025-10-04"

# NOTE: Build command MUST be configured in Cloudflare Pages dashboard
# Dashboard → Pages → ibr-web → Settings → Builds & deployments
# Build command: bun install --frozen-lockfile && bun run build
# Build output directory: dist

# Default environment (preview deployments)
[[kv_namespaces]]
binding = "CACHE"
id = "7e1092af548e4499931a485cb7d8f67c"  # ibr-cache-preview

[[kv_namespaces]]
binding = "SESSION"
id = "38c9584f3f7849d490881597922d91ae"  # ibr-session-preview

[vars]
NODE_ENV = "development"

# Production environment (main branch)
[env.production]

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "adb7e6b7c069439fbc77d278865381b6"  # ibr-cache

[[env.production.kv_namespaces]]
binding = "SESSION"
id = "6f739d78691b40d890171b25ebd0ec46"  # ibr-session

[env.production.vars]
NODE_ENV = "production"
